<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/main.css">
  <title>Register</title>
</head>
<body>
<header>
  <section>
    <div class="logo">
      <div class="logo-header">
        <h1>Register</h1>
      </div>
    </div>
    <div class="menu">
      <div class="menu-body">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="register.html">Register</a></li>
        </ul>
      </div>
    </div>
  </section>
</header>
<main>
  <section>
    <div class="content-form">
      <div class="form">
        <label>Full Name</label><br>
        <input class="input" type="text" placeholder="Enter your Full Name" required>
      </div>
      <div class="form">
        <label>Email</label><br>
        <input class="input" type="text" placeholder="Enter your email" required>
      </div>
      <div class="form">
        <label>Password</label><br>
        <input class="input" type="text" placeholder="Enter your password" required>
      </div>
      <div class="form">
        <label>Gender</label><br>
        <label for="male">Male</label>
        <input type="radio" id="male" name="gender" value="male"><br>
        <label for="female">Female</label>
        <input type="radio" id="female" name="gender" value="female">
      </div>
      <div class="form">
        <label>Hobbies</label><br>
        <label for="male">Reading</label>
        <input type="checkbox"><br>
        <label for="female">Traveling</label>
        <input type="checkbox"><br>
        <label for="female">Sport</label>
        <input type="checkbox"><br>
      </div>
      <div class="form">
        <label>Counrty</label><br>
        <select class="input">
          <option value="">Select your Country</option>
          <option value="">Select your Country</option>
          <option value="">Select your Country</option>
        </select>
      </div>
      <div class="form">
        <label>Notes</label><br>
        <textarea class="textarea" rows="10" cols="50">
          Write your notes here
        </textarea>
      </div>
      <div class="form">
        <button>
        </button>
      </div>
    </div>
  </section>
</main>
<footer>
  <section>
    <div class="content-footer">
      <div class="footer-body">
        <span>@ 2023 not copyright. All not copy</span>
      </div>
    </div>
  </section>
</footer>
<script src="../js/main.js"></script>
</body>
</html>
